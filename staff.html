<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0907">
<meta name="robots" content="noindex">
<title>قرمشة · لوحة الموظفين</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* ---------- staff workspace ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh;min-height:100dvh}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--bg2);border-left:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-inline:6px}
.side .brand b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1}
.side .brand small{display:block;color:var(--muted);font-size:12px}
.nav{background:transparent;border:0;color:var(--muted);text-align:right;padding:11px 14px;border-radius:12px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.nav:hover{color:var(--ink);background:var(--card)}
.nav[aria-current="true"]{background:var(--ember);color:#fff}
.nav .cnt{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:inline-grid;place-items:center;padding-inline:6px;font-weight:700}
.nav[aria-current="true"] .cnt{background:#fff;color:var(--ember2)}
.nav .cnt.pulse{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.side .grow{flex:1}
.side .who{font-size:12px;color:var(--muted);padding:8px 6px;border-top:1px solid var(--line);display:grid;gap:6px}
@media (max-width:900px){
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-left:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .brand{margin:0 0 0 6px}.side .brand small,.side .grow{display:none}.side .brand b{font-size:20px}
  .nav{flex:none;padding:8px 12px;min-height:38px;font-size:14px}
  .side .who{border:0;padding:0;flex:none;display:flex}
}
main{padding:22px 18px 80px;min-width:0}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:clamp(36px,5vw,52px)}
.head p{margin:2px 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.2vw,30px);line-height:1.15;color:var(--mustard);white-space:nowrap}
.kpi span{color:var(--muted);font-size:13px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi.pos b{color:var(--green)}.kpi.neg b{color:var(--red)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}

.tix{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;border-top:4px solid var(--mustard)}
.ticket.accepted{border-top-color:var(--blue)}.ticket.prep{border-top-color:var(--blue)}.ticket.ready{border-top-color:var(--green)}.ticket.out{border-top-color:var(--green)}
.ticket.late{box-shadow:0 0 0 2px rgba(255,106,85,.6)}
.ticket .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket .th b{font-family:var(--f-display);font-weight:400;font-size:24px}
.ticket ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ticket li{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;font-size:14px}
.ticket li .ph{width:40px;height:40px;border-radius:9px}
.ticket li b{font-size:16px;color:var(--mustard)}
.ticket .note{background:#2E2208;color:var(--mustard);border-radius:10px;padding:7px 10px;font-size:13px}
.ticket .cust{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;display:grid;gap:2px}
.ticket .acts{display:flex;gap:6px;flex-wrap:wrap}
.ticket .tot{display:flex;justify-content:space-between;font-weight:700;border-top:1px dashed var(--line2);padding-top:8px}
.ticket.new{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,194,61,.45)}}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;align-content:start;min-height:160px}
.col h3{margin:0;display:flex;justify-content:space-between;align-items:center;font-size:16px}

.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:right;display:grid;gap:3px;min-height:112px}
.tbl b{font-family:var(--f-display);font-weight:400;font-size:30px}
.tbl.busy{border-color:#6B4F10}
.tbl.bill{border-color:var(--red);background:#2D0F09;animation:blink2 1.6s infinite}
@keyframes blink2{50%{box-shadow:0 0 0 3px rgba(255,106,85,.4)}}
.tbl .t{font-size:13px;color:var(--muted)}

.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.car{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;border-top:4px solid var(--line2)}
.car.requested{border-top-color:var(--red)}.car.coming{border-top-color:var(--blue)}.car.arrived{border-top-color:var(--green)}
.plate{display:inline-block;background:#fff;color:#111;border:2px solid #111;border-radius:6px;padding:2px 12px;font-weight:700;letter-spacing:1px;direction:ltr;font-size:19px}

.adm-item{display:grid;grid-template-columns:120px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.adm-item .ph{aspect-ratio:4/3;border-radius:10px}
@media (max-width:560px){.adm-item{grid-template-columns:1fr}}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;min-width:620px;width:100%;height:auto}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qr{background:#fff;color:#111;border-radius:14px;padding:14px;text-align:center;display:grid;gap:6px;justify-items:center}
.qr b{font-family:var(--f-display);font-weight:400;font-size:26px}
.qr small{color:#555;font-size:11px;word-break:break-all;direction:ltr}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:min(380px,100%);display:grid;gap:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="printarea"></div>
<script src="config.js"></script>
<script>if(window.QARMASHA_CONFIG&&QARMASHA_CONFIG.firebase){document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"><\/script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"><\/script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"><\/script>');}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="core.js"></script>
<script>
(function(){
"use strict";
var esc=Q.esc,money=Q.money,db=Q.db;
var COSTS_SEED={"items": {"i1": 2750, "i2": 3750, "i3": 3500, "i4": 3500, "i5": 4250, "i6": 2750, "i7": 3250, "i8": 2750, "i9": 3000, "i10": 3750, "i11": 4250, "i12": 1500, "i13": 2000, "i14": 3500, "i15": 1250, "i16": 1750, "i17": 1250, "i18": 750, "i19": 500, "i20": 1500, "i21": 1000, "i22": 1250, "i23": 1250}, "offers": {"o1": 13500, "o2": 4000, "o3": 4500}, "estimated": true},costsSeeded=false;var USER=null,OWNER=false,M=null,RAW=null,costsExist=false;function RAWCOSTS(){return costsExist;}
var S={orders:[],requests:[],cars:[],bills:[],reviews:[],costs:{items:{},offers:{}},expenses:[]};
var subs=[],seen={},firstLoad={orders:true,requests:true,cars:true};
var ui={tab:localStorage.getItem("qs-tab")||"incoming",cashTab:"tables",admTab:"profit",sheet:null,bill:null,
  rep:{mode:"day",day:Q.isoDay(Date.now()),month:Q.isoDay(Date.now()).slice(0,7)},kTab:"orders"};
function monthStart(off){var d=new Date();d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()+(off||0));return d.getTime();}
var LIVE_FROM=monthStart(-1),billCache={};

/* ---------- auth + subscriptions ---------- */
db.auth.onChange(function(u){USER=u;OWNER=Q.isOwner(u);subs.forEach(function(f){try{f();}catch(e){}});subs=[];if(u)start();render();});
function permErr(e){if(e&&/permission/i.test(e.code||e.message||""))Q.toast("حسابك ما عنده صلاحية على هذي البيانات","bad");}
function start(){
  subs.push(db.onDoc("menu/config",function(d){RAW=d;M=d?Q.parseMenu(d):null;if(!d&&OWNER&&Q.SEED)db.set("menu/config",Q.SEED).catch(permErr);schedule();},permErr));
  subs.push(db.onQuery("orders",[["open","==",true]],function(l){diff("orders",l,function(o){return o.status==="pending";},function(o){return"طلب جديد #"+o.no+" · "+Q.TYPE[o.type]+(o.type==="dine"?" "+o.table:o.customer&&o.customer.area?" · "+o.customer.area:"");});S.orders=l;schedule();},permErr));
  subs.push(db.onQuery("requests",[["done","==",false]],function(l){diff("requests",l,function(){return true;},function(r){return"طاولة "+r.table+" تطلب الحساب";});S.requests=l;schedule();},permErr));
  subs.push(db.onQuery("cars",[["status","in",["parked","requested","coming","arrived"]]],function(l){diff("cars",l,function(c){return c.status==="requested";},function(c){return"طلب سيارة: "+c.plate+(c.name?" · "+c.name:"");});S.cars=l;schedule();},permErr));
  subs.push(db.onQuery("bills",[["ts",">=",LIVE_FROM]],function(l){S.bills=l;schedule();},permErr));
  subs.push(db.onQuery("reviews",[],function(l){S.reviews=l.sort(function(a,b){return b.ts-a.ts;});schedule();},permErr));
  if(OWNER){subs.push(db.onDoc("mgmt/costs",function(d){if(!d&&!costsSeeded){costsSeeded=true;db.set("mgmt/costs",COSTS_SEED).catch(function(){});}costsExist=!!d;S.costs=Object.assign({items:{},offers:{}},d||{});schedule();},function(){}));
    subs.push(db.onQuery("mgmt/main/expenses",[],function(l){S.expenses=l;schedule();},function(){}));}
}
function diff(kind,list,want,text){var fresh=[];list.forEach(function(x){if(!seen[kind+x.id]){seen[kind+x.id]=1;if(!firstLoad[kind]&&want(x))fresh.push(text(x));}});firstLoad[kind]=false;
  if(fresh.length){fresh.slice(0,3).forEach(function(t){Q.toast(t);});Q.beep(3);}}
setInterval(function(){if(S.orders.some(function(o){return o.status==="pending"&&Q.mins(o.ts)>=0;})||S.cars.some(function(c){return c.status==="requested";}))Q.beep(2);},25000);
setInterval(function(){schedule();},30000);

/* ---------- helpers ---------- */
function item(id){return M&&M.items.find(function(x){return x.id===id;});}
function photo(src,alt){return Q.photo(src,alt,schedule);}
function byStatus(st){return S.orders.filter(function(o){return st.indexOf(o.status)>-1;}).sort(function(a,b){return a.ts-b.ts;});}
function tableOrders(t){return S.orders.filter(function(o){return o.type==="dine"&&o.table===t&&["rejected","pending"].indexOf(o.status)<0;});}
function tableTotal(t){return tableOrders(t).reduce(function(a,o){return a+o.total;},0);}
function billReq(t){return S.requests.find(function(r){return r.table===t;});}
function costOf(it){if(!it)return 0;var id=it.id||"";if(id.indexOf("o:")===0)return+(S.costs.offers[id.slice(2)]||0);return+(S.costs.items[id]||0);}
function billCost(b){return(b.items||[]).reduce(function(a,i){return a+costOf(i)*i.q;},0);}
function custHTML(o){if(o.type==="dine")return"";var c=o.customer||{};return'<div class="cust"><span><b>'+esc(c.name||"")+'</b> · <a href="tel:'+esc(String(c.phone||"").replace(/\s/g,""))+'" class="num" dir="ltr">'+esc(c.phone||"")+'</a></span>'+(o.type==="delivery"?'<span>'+esc(c.area||"")+' · '+esc(c.address||"")+'</span>':'')+'</div>';}
function itemsHTML(o){return'<ul>'+o.items.map(function(i){return'<li>'+photo(i.img,i.name)+'<span>'+esc(i.name)+'</span><b class="num">×'+i.q+'</b></li>';}).join("")+'</ul>'+(o.note?'<div class="note">'+esc(o.note)+'</div>':'');}
function where(o){return o.type==="dine"?'طاولة <span class="num">'+o.table+'</span>':o.type==="delivery"?'توصيل':'استلام';}
function fail(e){Q.toast(Q.errMsg(e),"bad");}

/* ---------- views ---------- */
var NAV=[["incoming","الطلبات الجديدة"],["kitchen","المطبخ"],["delivery","التوصيل والاستلام"],["cashier","الكاشير"],["garage","الكراج"],["admin","الإدارة"]];
function badge(k){if(k==="incoming")return byStatus(["pending"]).length;if(k==="kitchen")return byStatus(["accepted"]).length;if(k==="delivery")return S.orders.filter(function(o){return o.type!=="dine"&&["ready","out"].indexOf(o.status)>-1;}).length;if(k==="cashier")return S.requests.length;if(k==="garage")return S.cars.filter(function(c){return c.status==="requested";}).length;return 0;}
function sideHTML(){var s=M?M.settings:{name:"قرمشة"};
  return'<nav class="side" aria-label="الأقسام"><div class="brand"><span class="logo">'+esc(s.name.charAt(0))+'</span><div><b>'+esc(s.name)+'</b><small>لوحة الموظفين</small></div></div>'+
    NAV.filter(function(n){return n[0]!=="admin"||OWNER;}).map(function(n){var c=badge(n[0]);return'<button class="nav" data-act="tab" data-v="'+n[0]+'" aria-current="'+(ui.tab===n[0])+'"><span>'+n[1]+'</span>'+(c?'<span class="cnt num'+(n[0]==="incoming"||n[0]==="garage"?' pulse':'')+'">'+c+'</span>':'')+'</button>';}).join("")+
    '<div class="grow"></div><div class="who"><span>'+esc(USER&&USER.email||"")+'</span>'+(Q.live?'<button class="btn btn-ghost btn-sm" data-act="logout">تسجيل خروج</button>':'')+'<a class="btn btn-ghost btn-sm" href="./" target="_blank" rel="noopener">موقع الزبون ↗</a></div></nav>';}
function incomingHTML(){var L=byStatus(["pending"]);
  var h='<div class="head"><div><h1 class="disp">الطلبات الجديدة</h1><p class="hint">كل طلب يوصل من موقع الزبون يظهر هنا مع صوت تنبيه. اقبله حتى يروح للمطبخ، أو ارفضه ويوصل للزبون السبب.</p></div></div>';
  if(!L.length)return h+'<div class="empty">ماكو طلبات جديدة هسه. أول ما يطلب زبون يطلع هنا.</div>';
  return h+'<div class="tix">'+L.map(function(o){return'<div class="ticket new"><div class="th"><b>'+where(o)+'</b><span class="hint num">#'+o.no+' · '+Q.ago(o.ts)+'</span></div>'+custHTML(o)+itemsHTML(o)+
    '<div class="tot"><span>'+(o.deliveryFee?'يشمل توصيل '+money(o.deliveryFee):'الإجمالي')+'</span><span class="num">'+money(o.total)+'</span></div>'+
    '<div class="acts"><button class="btn btn-green" data-act="accept" data-id="'+o.id+'">قبول الطلب</button><button class="btn btn-red btn-sm" data-act="reject" data-id="'+o.id+'">رفض</button></div></div>';}).join("")+'</div>';}
function kitchenHTML(){
  var h='<div class="head"><div><h1 class="disp">المطبخ</h1><p class="hint">الطلب اللي يعدّي 15 دقيقة يتلوّن أحمر.</p></div><div class="tabs"><button class="chip" data-act="ktab" data-v="orders" aria-pressed="'+(ui.kTab==="orders")+'">الطلبات</button><button class="chip" data-act="ktab" data-v="stock" aria-pressed="'+(ui.kTab==="stock")+'">الكميات والنفاذ</button></div></div>';
  if(ui.kTab==="stock")return h+stockHTML();
  var cols=[["accepted","بانتظار البدء"],["prep","قيد التحضير"],["ready","جاهز"]];
  h+='<div class="cols">';
  cols.forEach(function(c){var L=byStatus([c[0]]);h+='<div class="col"><h3><span>'+c[1]+'</span><span class="pill '+c[0]+' num">'+L.length+'</span></h3>'+(L.length?'':'<p class="hint">ماكو شي.</p>')+
    L.map(function(o){var late=Q.mins(o.acceptedAt||o.ts)>=15&&o.status!=="ready";return'<div class="ticket '+o.status+(late?' late':'')+'"><div class="th"><b>'+where(o)+'</b><span class="hint num">#'+o.no+' · '+Q.ago(o.acceptedAt||o.ts)+'</span></div>'+itemsHTML(o)+
      '<div class="acts">'+(o.status==="accepted"?'<button class="btn btn-blue btn-sm" data-act="st" data-id="'+o.id+'" data-v="prep">ابدأ التحضير</button>':'')+(o.status==="prep"?'<button class="btn btn-green btn-sm" data-act="st" data-id="'+o.id+'" data-v="ready">جاهز</button>':'')+
      (o.status==="ready"&&o.type==="dine"?'<button class="btn btn-mustard btn-sm" data-act="st" data-id="'+o.id+'" data-v="served">انقدّم للطاولة</button>':'')+(o.status==="ready"&&o.type!=="dine"?'<span class="hint">بانتظار '+(o.type==="delivery"?'الدلفري':'الزبون')+' من تبويب التوصيل والاستلام</span>':'')+'</div></div>';}).join("")+'</div>';});
  return h+'</div>';}
function stockHTML(){if(!M)return"";return'<div class="panel" style="margin-bottom:14px"><p class="hint">اكتب الكمية الباقية. تنقص وحدها لما تقبل طلب، ولما توصل صفر يطلع للزبون "نفذت الكمية". اتركها فارغة إذا مفتوحة.</p></div><div class="tables" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">'+
  M.items.map(function(it){return'<div class="adm-item" style="grid-template-columns:56px 1fr auto;align-items:center">'+photo(it.img,it.name)+'<div style="min-width:0"><b style="font-size:14px">'+esc(it.name)+'</b><div>'+(Q.avail(it)?'<span class="pill ready">متوفر</span>':'<span class="pill red">نافذ</span>')+'</div></div><div style="display:flex;gap:6px;align-items:center"><input class="input num" style="width:70px;text-align:center;min-height:38px;padding:6px" type="number" min="0" data-stock="'+esc(it.id)+'" value="'+(it.stock==null?'':it.stock)+'" placeholder="∞" aria-label="الكمية"><label class="switch"><input type="checkbox" data-avail="'+esc(it.id)+'"'+(it.available?' checked':'')+' aria-label="متوفر"></label></div></div>';}).join("")+'</div>';}
function deliveryHTML(){var L=S.orders.filter(function(o){return o.type!=="dine"&&["accepted","prep","ready","out"].indexOf(o.status)>-1;}).sort(function(a,b){return a.ts-b.ts;});
  var h='<div class="head"><div><h1 class="disp">التوصيل والاستلام</h1><p class="hint">لما الطلب يصير جاهز: سلّمه للدلفري، وبعد ما يوصل سجّل استلام المبلغ.</p></div></div>';
  if(!L.length)return h+'<div class="empty">ماكو طلبات توصيل أو استلام مفتوحة.</div>';
  return h+'<div class="tix">'+L.map(function(o){return'<div class="ticket '+o.status+'"><div class="th"><b>'+(o.type==="delivery"?'توصيل':'استلام')+'</b><span class="pill '+o.status+'">'+(Q.STATUS[o.status])+'</span></div><span class="hint num">#'+o.no+' · '+Q.ago(o.ts)+'</span>'+custHTML(o)+itemsHTML(o)+
    '<div class="tot"><span>المبلغ المطلوب من الزبون</span><span class="num">'+money(o.total)+'</span></div><div class="acts">'+
    (o.status==="ready"&&o.type==="delivery"?'<button class="btn btn-blue btn-sm" data-act="st" data-id="'+o.id+'" data-v="out">طلع مع الدلفري</button>':'')+
    ((o.status==="out")||(o.status==="ready"&&o.type==="pickup")?'<button class="btn btn-green btn-sm" data-act="settle" data-id="'+o.id+'">'+(o.type==="delivery"?'وصل واستلمنا المبلغ':'استلمه الزبون ودفع')+'</button>':'')+

function chart(rows){var W=760,H=230,pl=80,pr=12,pt=14,pb=28,iw=W-pl-pr,ih=H-pt-pb,vals=rows.map(function(r){return r.net;}),mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));if(mx===mn)mx=mn+1;

  var st=step((mx-mn)/4),top=Math.ceil(mx/st)*st,bot=Math.floor(mn/st)*st;if(top===bot)top=bot+st;function Y(v){return pt+(top-v)/(top-bot)*ih;}
  var bw=iw/rows.length,g='';
  for(var v=bot;v<=top+1e-6;v+=st)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#2F221A"/><text x="'+(pl-8)+'" y="'+(Y(v)+4).toFixed(1)+'" fill="#9E8875" font-size="11" text-anchor="end">'+(v===0?"0":Math.abs(v)>=1e6?(v/1e6).toFixed(1)+" مليون":Math.round(v/1000)+" ألف")+'</text>';

    if(r.d===1||r.d%5===0)g+='<text x="'+(x+bw*.35).toFixed(1)+'" y="'+(H-8)+'" fill="#9E8875" font-size="11" text-anchor="middle">'+r.d+'</text>';});
  return'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="صافي الدخل اليومي">'+g+'</svg>';}

  if(t.id==="repmonth"){if(t.value){ui.rep.month=t.value;render();}return;}
  if(t.hasAttribute("data-upload")){var f=t.files&&t.files[0],path=t.getAttribute("data-upload");if(!f)return;Q.toast("جاري رفع الصورة…");
    Q.shrink(f,path==="settings.hero"?1400:640,.78).then(function(data){var iid="img"+Date.now().toString(36);return db.set("images/"+iid,{data:data}).then(function(){var u={};u[path==="settings.hero"?"settings.hero":path+".img"]="fs:"+iid;return db.update("menu/config",u);});}).then(function(){Q.toast("انرفعت الصورة","ok");}).catch(fail);return;}
  if(t.hasAttribute("data-stock")){var u={};u["items."+t.getAttribute("data-stock")+".stock"]=t.value===""?null:Math.max(0,+t.value);upd("menu/config",u);return;}
  if(t.hasAttribute("data-avail")){var u2={};u2["items."+t.getAttribute("data-avail")+".available"]=t.checked;upd("menu/config",u2);return;}
  if(t.hasAttribute("data-cost")){var c={};c["items."+t.getAttribute("data-cost")]=+t.value||0;c.estimated=false;(RAWCOSTS()?db.update("mgmt/costs",c):db.set("mgmt/costs",{items:Object.assign({},S.costs.items,{[t.getAttribute("data-cost")]:+t.value||0}),offers:S.costs.offers||{}})).catch(fail);return;}
  if(t.hasAttribute("data-ocost")){var c2={};c2["offers."+t.getAttribute("data-ocost")]=+t.value||0;c2.estimated=false;(RAWCOSTS()?db.update("mgmt/costs",c2):db.set("mgmt/costs",{items:S.costs.items||{},offers:Object.assign({},S.costs.offers,{[t.getAttribute("data-ocost")]:+t.value||0})})).catch(fail);return;}
  if(t.hasAttribute("data-tag")){var it=item(t.getAttribute("data-id"));if(!it)return;var tag=t.getAttribute("data-tag"),tags=(it.tags||[]).filter(function(x){return x!==tag;});if(t.checked)tags.push(tag);var u3={};u3["items."+it.id+".tags"]=tags;upd("menu/config",u3);return;}
  if(t.hasAttribute("data-cat")){var cs=M.categories.slice();cs[+t.getAttribute("data-cat")]=Object.assign({},cs[+t.getAttribute("data-cat")],{name:t.value});upd("menu/config",{categories:cs});return;}
  if(t.hasAttribute("data-area")){var ar=M.settings.delivery.areas.map(function(x){return Object.assign({},x);}),k=t.getAttribute("data-k");ar[+t.getAttribute("data-area")][k]=k==="fee"?(+t.value||0):t.value;upd("menu/config",{"settings.delivery.areas":ar});return;}
  var p=t.getAttribute("data-path");if(!p)return;var val=t.type==="checkbox"?t.checked:t.type==="number"?(+t.value||0):t.value,o={};o[p]=val;upd("menu/config",o);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.sheet){ui.sheet=null;renderSheet();}});
render();
})();
</script>
