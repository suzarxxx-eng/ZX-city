<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>OG Crafting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <div class="panel">
    <!-- الهيدر -->
    <header>
      <div class="brand">
        <div class="og">OG</div>
        <div>
          <div class="ttl" id="tableName">ورشة OG</div>
          <div class="sub">أدوات السرقة • الأسلحة • الأصفاد</div>
        </div>
      </div>

      <div class="lvl">
        <div class="hex"><span id="lvNum">0</span></div>
        <div class="lvInfo">
          <div class="lvTop">
            <span class="lvName" id="lvName">مبتدئ</span>
            <span class="lvXp" id="lvXp">0 / 100 XP</span>
          </div>
          <div class="bar"><i id="lvBar"></i></div>
          <div class="pips" id="pips"></div>
        </div>
        <div class="speed"><b id="speed">0%</b><span>سرعة</span></div>
      </div>

      <button class="x" id="closeBtn" title="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="body">
      <!-- الأقسام -->
      <aside class="cats" id="cats"></aside>

      <!-- الوصفات -->
      <section class="list">
        <div class="tools">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="search" placeholder="دور على غرض..." autocomplete="off">
          </div>
          <label class="tg"><input type="checkbox" id="onlyCan"><span></span>اللي أكدر أصنعه</label>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <!-- التفاصيل -->
      <section class="detail" id="detail">
        <div class="empty">اختار غرض حتى تشوف طريقة تصنيعه</div>
      </section>
    </div>

    <!-- التقدم -->
    <div class="progress hidden" id="progress">
      <div class="pbox">
        <img id="pImg" src="" alt="">
        <div class="pTxt">
          <div class="pName" id="pName"></div>
          <div class="pSub" id="pSub">جاري التصنيع...</div>
          <div class="pbar"><i id="pBar"></i></div>
        </div>
        <button class="pCancel" id="pCancel">إلغاء</button>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
