<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>

<div id="mdt" class="hidden">
  <div class="screen">
    <nav id="side">
      <div class="brand">
        <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5z"/><path d="m12 7 1.5 3 3.3.5-2.4 2.3.6 3.2-3-1.5-3 1.5.6-3.2-2.4-2.3 3.3-.5z" fill="#0a1a33"/></svg></span>
        <div><b>MDT</b><small id="jobLabel">الأمن العام</small></div>
      </div>
      <div id="nav"></div>
      <div class="meBox">
        <div class="meTop">
          <span class="av" id="meAv">؟</span>
          <div><b id="meName"></b><small id="meRank"></small></div>
        </div>
        <div class="meRow">
          <button type="button" id="meCs" class="cs" title="غيّر الكود"></button>
          <select id="meStatus" title="حالتك"></select>
        </div>
      </div>
    </nav>

    <section id="main">
      <header id="top">
        <div class="tTitle"><b id="pageTitle">الرئيسية</b><small id="pageSub"></small></div>
        <div class="clock"><b id="clock">00:00</b><small id="date"></small></div>
        <button type="button" class="x" id="closeBtn" title="إغلاق (Esc)">✕</button>
      </header>
      <div id="page"></div>
    </section>
  </div>
</div>

<div id="modal" class="hidden"><div class="mBox" id="mBox"></div></div>
<div id="toasts"></div>

<script src="script.js"></script>
</body>
</html>
