<!DOCTYPE html>
    <head>
        <link href="style.css" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.29/vue.global.prod.js"></script>
    </head>

    <body>
        <div id="mainContainer">
            <audio id="sounds"><source type="audio/ogg"></audio>
            <div id="doorlock-container" :class="doorlockClassObject" :style="doorlockStyleObject">{{ doorText }}</div>
            <div class="textInfo">
                <p id="aim" style="display: none;">Aim at your desired door.<br>Press the left mouse button to confirm the selected door</p>
                <div id="textDetails" style="display: none;">
                    <p id="coords">Coordinates: {{ coords }}</p>
                    <p id="heading">Heading: {{ heading }}</p>
                    <p id="hash">Hash: {{ hash }}</p>
                </div>
            </div>
        </div>
        <div id="lockIcon" style="display: none;">
            <svg viewBox="-30 -42 60 84" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lockBody" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#b9bec4"/>
                        <stop offset="0.5" stop-color="#8f959c"/>
                        <stop offset="1" stop-color="#5f656c"/>
                    </linearGradient>
                    <linearGradient id="lockShackle" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#8d949c"/>
                        <stop offset="0.4" stop-color="#e3e6e9"/>
                        <stop offset="1" stop-color="#7a8087"/>
                    </linearGradient>
                </defs>
                <path d="M-16 -4 V-22 a16 16 0 0 1 32 0 V-4" fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
                <path d="M-16 -4 V-22 a16 16 0 0 1 32 0 V-4" fill="none" stroke="url(#lockShackle)" stroke-width="7" stroke-linecap="round"/>
                <rect x="-26" y="-6" width="52" height="40" rx="7" fill="#1a1a1a"/>
                <rect x="-24" y="-4" width="48" height="36" rx="6" fill="url(#lockBody)"/>
                <rect x="-21" y="-1.5" width="42" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
                <circle cx="0" cy="12" r="5" fill="#2a2d30"/>
                <path d="M-2 14 h4 l1.5 10 h-7 z" fill="#2a2d30"/>
            </svg>
        </div>
        <script src="app.js" type="text/javascript"></script>
    </body>
</html>
