<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-theme="cyber">

  <!-- Cinematic bars -->
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <!-- Player status bars -->
  <div class="widget" id="w-status" data-id="status">
    <div class="tilt" id="bars">
      <div class="hpwrap" id="b-health">
        <svg class="hico" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <div class="hp">
          <i class="fill"></i>
          <div class="ar" id="b-armor"><i class="fill"></i></div>
          <span class="num">100</span>
        </div>
      </div>
      <div class="row2">
        <div class="food" id="b-hunger">
          <div class="hex"><svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg></div>
          <div class="segs"><i class="fill"></i></div>
          <span class="num">100</span>
        </div>
        <div class="drink" id="b-thirst">
          <div class="drop"><svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8z"/></svg></div>
          <div class="pill"><i class="fill"></i></div>
          <span class="num">100</span>
        </div>
      </div>
      <div class="st" id="b-stamina"><i class="fill"></i></div>
    </div>
  </div>

  <!-- Vehicle HUD -->
  <div class="widget" id="w-vehicle" data-id="vehicle" data-style="arc">
    <div class="tilt veh">
      <div class="speedo">
        <svg class="dial" viewBox="0 0 200 200">
          <g transform="rotate(135 100 100)">
            <circle class="track" cx="100" cy="100" r="84" pathLength="100" stroke-dasharray="75 100"/>
            <circle class="track thin" cx="100" cy="100" r="68" pathLength="100" stroke-dasharray="75 100"/>
            <circle class="arc spd" id="spdArc" cx="100" cy="100" r="84" pathLength="100" stroke-dasharray="0 100"/>
            <circle class="arc rpm" id="rpmArc" cx="100" cy="100" r="68" pathLength="100" stroke-dasharray="0 100"/>
          </g>
          <g id="ticks"></g>
          <g id="needle"><line x1="100" y1="100" x2="100" y2="30"/><circle cx="100" cy="100" r="5"/></g>
        </svg>
        <div class="read">
          <b id="spd">0</b>
          <small id="unit">KMH</small>
          <em id="gear">N</em>
        </div>
      </div>
      <div class="digi-rpm"><i id="rpmBar"></i></div>
      <div class="side">
        <div class="fuel"><i id="fuelBar"></i><span id="fuelTxt">100</span></div>
        <div class="icons">
          <svg id="beltIco" viewBox="0 0 24 24"><title>Seatbelt</title><path d="M12 2a3 3 0 100 6 3 3 0 000-6zM9 9l-2 13h2.2l.8-5h4l.8 5H17L15 9H9zm1.2 2h3.6l.4 3h-4.4z"/></svg>
          <svg id="engIco" viewBox="0 0 24 24"><title>Engine</title><path d="M7 4v2h3v2H6l-2 2v3H2v4h2v2h3l2 2h7v-3h2v-3h2V9h-3V7h-2V4H7z"/></svg>
          <svg id="bodyIco" viewBox="0 0 24 24"><title>Body</title><path d="M18.9 6a2 2 0 00-1.9-1.4H7A2 2 0 005.1 6L3 12v8a1 1 0 001 1h1a1 1 0 001-1v-1h12v1a1 1 0 001 1h1a1 1 0 001-1v-8l-2.1-6zM7 15.5A1.5 1.5 0 117 12a1.5 1.5 0 010 3.500zm10 0a1.5 1.5 0 110-3.500 1.5 1.5 0 010 3.500zM5.800 10l1.200-3.400h10L18.200 10H5.800z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Duty badge -->
  <div class="widget" id="w-job" data-id="job">
    <div class="tilt badge"><span id="jobIco">🚓</span><span id="jobTxt">وحدات وزارة الداخلية: 0</span></div>
  </div>

  <!-- قائمة الإعدادات (U) -->
  <div id="menu" dir="rtl">
    <header><h1>إعدادات الواجهة</h1><button id="mClose" title="إغلاق (U / Esc)">✕</button></header>
    <p class="hint">اسحب أي عنصر على الشاشة لتغيير مكانه.</p>

    <section>
      <h2>الثيم</h2>
      <div class="seg" data-key="theme">
        <button data-val="cyber">سايبربانك</button>
        <button data-val="dark">داكن</button>
        <button data-val="glass">زجاجي</button>
        <button data-val="tactical">تكتيكي</button>
      </div>
    </section>

    <section>
      <h2>العداد</h2>
      <div class="seg" data-key="speedStyle">
        <button data-val="digital">رقمي</button>
        <button data-val="arc">قوس سباق</button>
        <button data-val="gauge">عداد 3D</button>
      </div>
      <div class="seg" data-key="units">
        <button data-val="kmh">كم/س</button>
        <button data-val="mph">ميل/س</button>
      </div>
    </section>

    <section>
      <h2>العناصر</h2>
      <label class="tg"><input type="checkbox" data-key="show.status"><span></span>خطوط الحالة</label>
      <label class="tg"><input type="checkbox" data-key="show.vehicle"><span></span>واجهة السيارة</label>
      <label class="tg"><input type="checkbox" data-key="show.job"><span></span>شارة الدوام</label>
      <label class="tg"><input type="checkbox" data-key="frame"><span></span>إطار الخلفية</label>
      <label class="tg"><input type="checkbox" data-key="hideFull"><span></span>إخفاء الممتلئ</label>
      <label class="tg"><input type="checkbox" data-key="cinematic"><span></span>الوضع السينمائي</label>
    </section>

    <section>
      <h2>التخطيط</h2>
      <label class="rg">الحجم <input type="range" min="0.6" max="1.5" step="0.05" data-key="scale"><b data-out="scale"></b></label>
      <label class="rg">الشفافية <input type="range" min="0.3" max="1" step="0.05" data-key="opacity"><b data-out="opacity"></b></label>
    </section>

    <footer><button id="mReset">إعادة الضبط</button><button id="mDone" class="pri">تم</button></footer>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
